<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="./">
    <title>Matiz</title>
    <meta name="description" content="Matiz: editor de imagens no estilo do Paint do Windows, com camadas, pincéis artísticos, formas, texto, remoção de fundo e uma aba dedicada à pixel art.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/paint.css">
    <style id="print-style"></style>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="paint" class="paint" data-mode="paint">
      <header class="topbar">
        <div class="brand">
          <span id="logo" class="logo" aria-hidden="true"></span>
          <span class="brand-name">Matiz</span>
        </div>
        <div id="mode-switch" class="mode-switch" role="tablist" aria-label="Modo do editor"></div>
        <nav id="menus" class="menus" aria-label="Menu principal"></nav>
        <input id="file-name" class="project-name" type="text" maxlength="120" aria-label="Nome da imagem" spellcheck="false">
        <div class="topbar-actions">
          <button id="undo" type="button" class="icon-button" aria-label="Desfazer"></button>
          <button id="redo" type="button" class="icon-button" aria-label="Refazer"></button>
          <button id="save" type="button" class="icon-button" title="Salvar (Ctrl+S)" aria-label="Salvar"></button>
          <button id="palette" type="button" class="icon-button" aria-haspopup="true" aria-expanded="false" aria-label="Paleta de cores da interface" title="Paleta de cores da interface"></button>
          <button id="theme" type="button" class="icon-button" aria-label="Alternar tema"></button>
          <button id="settings" type="button" class="icon-button" title="Configurações" aria-label="Configurações"></button>
        </div>
      </header>
      <div id="ribbon" class="ribbon" role="toolbar" aria-label="Ferramentas do Paint"></div>
      <div id="subbar" class="options subbar" aria-label="Opções da ferramenta"></div>
      <main class="paint-main">
        <div id="workspace" class="workspace">
          <span class="ruler-corner" aria-hidden="true"></span>
          <canvas id="ruler-top" class="ruler ruler-top" aria-hidden="true"></canvas>
          <canvas id="ruler-left" class="ruler ruler-left" aria-hidden="true"></canvas>
          <div id="stage" class="stage" tabindex="0" aria-label="Tela de desenho">
            <div id="sizer" class="sizer">
              <div id="paper-wrap" class="paper-wrap">
                <canvas id="paper" class="paper" aria-label="Imagem"></canvas>
                <textarea id="text-editor" class="text-editor" spellcheck="false" aria-label="Texto" hidden></textarea>
              </div>
            </div>
          </div>
          <canvas id="overlay" class="overlay" aria-hidden="true"></canvas>
          <div id="busy" class="busy" hidden><span>Analisando a imagem…</span></div>
          <div id="thumbnail" class="thumbnail-window" hidden></div>
        </div>
        <aside id="layers-panel" class="paint-layers" aria-label="Camadas"></aside>
      </main>
      <footer class="status paint-status">
        <span class="status-cell"><span id="status-position-icon" class="icon-label"></span><span id="status-position" class="mono"></span></span>
        <span class="status-cell"><span id="status-selection-icon" class="icon-label"></span><span id="status-selection" class="mono"></span></span>
        <span class="status-cell"><span id="status-size-icon" class="icon-label"></span><span id="status-size" class="mono"></span></span>
        <span class="status-cell"><span id="status-file-icon" class="icon-label"></span><span id="status-file" class="mono"></span></span>
        <span class="zoom-control">
          <button id="zoom-label" type="button" class="zoom-label mono" aria-haspopup="true" title="Nível de zoom">100%</button>
          <button id="zoom-out" type="button" class="icon-button" title="Reduzir" aria-label="Reduzir"></button>
          <input id="zoom-range" type="range" step="1" aria-label="Zoom">
          <button id="zoom-in" type="button" class="icon-button" title="Ampliar" aria-label="Ampliar"></button>
        </span>
      </footer>
    </div>
    <iframe id="pixel-frame" class="pixel-frame" title="Pixel Art" hidden></iframe>
    <div id="fullscreen-view" class="fullscreen-view" tabindex="-1" hidden></div>
    <div id="print-sheet" class="print-sheet" aria-hidden="true"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
