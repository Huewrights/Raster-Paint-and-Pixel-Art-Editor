name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Núcleo (JavaScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Testes do núcleo
        run: npm test
      - name: Matiz.html em dia com o código
        run: npm run portable -- --check

  desktop:
    name: App desktop (Matiz.exe)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: desktop/go.sum
      - name: Matiz.exe compila a partir do código atual
        env:
          MATIZ_EXE_OUT: ${{ runner.temp }}/Matiz.exe
        run: npm run desktop -- --check
      - uses: actions/upload-artifact@v4
        with:
          name: Matiz-exe
          path: ${{ runner.temp }}/Matiz.exe
          retention-days: 14
      - name: Análise do código Go
        working-directory: desktop
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...

  interface:
    name: Interface (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Testes ponta a ponta
        run: python -m unittest discover -s tests/e2e -v
